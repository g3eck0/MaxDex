<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaxDex</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --accent-2: #34d399;
      --border: rgba(148, 163, 184, 0.28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    input[type="text"] {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 1rem;
    }

    .sort-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sort-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .sort-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #031827;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
    }

    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .dex-id {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 700;
      text-align: left;
    }

    .sprite {
      width: 90px;
      height: 90px;
      margin: 0 auto;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 18px rgba(96, 165, 250, 0.35));
    }

    .name {
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="toolbar">
      <h1 class="title">MaxDex</h1>

      <div class="controls">
        <input id="search" type="text" placeholder="Search Pokémon..." aria-label="Search Pokémon" />

        <div class="sort-group" aria-label="Sort options">
          <button type="button" class="sort-btn active" data-sort="number">Sort by Number</button>
          <button type="button" class="sort-btn" data-sort="alpha">Sort by A–Z</button>
        </div>
      </div>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>
  </div>

  <script>
    const pokemonNames = [
      'Bulbasaur','Ivysaur','Venusaur','Charmander','Charmeleon','Charizard','Squirtle','Wartortle','Blastoise','Caterpie','Metapod','Butterfree','Weedle','Kakuna','Beedrill','Pidgey','Pidgeotto','Pidgeot','Rattata','Raticate','Spearow','Fearow','Ekans','Arbok','Pikachu','Raichu','Sandshrew','Sandslash','Nidoran♀','Nidorina','Nidoqueen','Nidoran♂','Nidoking','Clefairy','Clefable','Vulpix','Ninetales','Jigglypuff','Wigglytuff','Zubat','Golbat','Oddish','Gloom','Vileplume','Paras','Parasect','Venonat','Venomoth','Diglett','Dugtrio','Meowth','Persian','Psyduck','Golduck','Mankey','Primeape','Growlithe','Arcanine','Poliwag','Poliwhirl','Poliwrath','Abra','Kadabra','Alakazam','Machop','Machoke','Machamp','Bellsprout','Weepinbell','Victreebel','Tentacool','Tentacruel','Geodude','Graveler','Golem','Ponyta','Rapidash','Slowpoke','Slowbro','Magnemite','Magneton','Farfetch\'d','Doduo','Dodrio','Seel','Dewgong','Grimer','Muk','Shellder','Cloyster','Gastly','Haunter','Gengar','Onix','Drowzee','Hypno','Krabby','Kingler','Voltorb','Electrode','Exeggcute','Exeggutor','Cubone','Marowak','Hitmonlee','Hitmonchan','Lickitung','Koffing','Weezing','Rhyhorn','Rhydon','Chansey','Tangela','Kangaskhan','Horsea','Seadra','Goldeen','Seaking','Staryu','Starmie','Mr. Mime','Scyther','Jynx','Electabuzz','Magmar','Pinsir','Tauros','Magikarp','Gyarados','Lapras','Ditto','Eevee','Vaporeon','Jolteon','Flareon','Porygon','Omanyte','Omastar','Kabuto','Kabutops','Aerodactyl','Snorlax','Articuno','Zapdos','Moltres','Dratini','Dragonair','Dragonite','Mewtwo','Mew'
    ];

    const pokemon = Array.from({ length: 1025 }, (_, index) => ({
      id: index + 1,
      name: pokemonNames[index] || `Pokémon ${index + 1}`
    }));

    let currentSort = 'number';
    let searchTerm = '';

    const searchInput = document.getElementById('search');
    const grid = document.getElementById('grid');

    function getFilteredPokemon() {
      let items = [...pokemon];

      if (searchTerm.trim()) {
        const query = searchTerm.trim().toLowerCase();
        items = items.filter(p =>
          p.name.toLowerCase().includes(query) || String(p.id).includes(query)
        );
      }

      if (currentSort === 'alpha') {
        items.sort((a, b) => a.name.localeCompare(b.name) || a.id - b.id);
      } else {
        items.sort((a, b) => a.id - b.id);
      }

      return items;
    }

    function render() {
      const items = getFilteredPokemon();
      grid.innerHTML = items.map(p => `
        <article class="card" aria-label="${p.name}">
          <div class="dex-id">#${String(p.id).padStart(4, '0')}</div>
          <img class="sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" alt="${p.name}" />
          <p class="name">${p.name}</p>
        </article>
      `).join('');
    }

    searchInput.addEventListener('input', (event) => {
      searchTerm = event.target.value;
      render();
    });

    document.querySelectorAll('.sort-btn').forEach(button => {
      button.addEventListener('click', () => {
        currentSort = button.dataset.sort;
        document.querySelectorAll('.sort-btn').forEach(btn => {
          btn.classList.toggle('active', btn === button);
        });
        render();
      });
    });

    render();
  </script>
</body>
</html>
